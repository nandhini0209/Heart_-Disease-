<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart Disease Prediction</title>
  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<!-- ============================================================ -->
<!-- Navbar -->
<!-- ============================================================ -->
<nav class="navbar navbar-expand-lg navbar-dark bg-danger">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/"><i class="bi bi-heart-pulse-fill"></i> Heart Risk AI</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- ============================================================ -->
<!-- Hero Section -->
<!-- ============================================================ -->
<section class="hero-section text-center py-5">
  <div class="container">
    <h1 class="display-4 fw-bold text-white">Heart Disease Risk Predictor</h1>
    <p class="lead text-white-50">Enter your clinical data below to assess your cardiovascular risk using AI.</p>
  </div>
</section>

<!-- ============================================================ -->
<!-- Prediction Form -->
<!-- ============================================================ -->
<section class="py-5 bg-light">
  <div class="container">

    <!-- Error Message -->
    {% if error %}
    <div class="alert alert-warning text-center">{{ error }}</div>
    {% endif %}

    <div class="card shadow-lg border-0 p-4">
      <h4 class="text-danger mb-4 text-center"><i class="bi bi-clipboard2-pulse"></i> Enter Your Clinical Data</h4>

      <form action="/predict" method="POST" id="predictionForm">
        <div class="row g-3">

          <!-- Age -->
          <div class="col-md-6">
            <label for="age" class="form-label fw-semibold">Age
              <i class="bi bi-info-circle text-muted" data-bs-toggle="tooltip" title="Your age in years"></i>
            </label>
            <input type="number" class="form-control" id="age" name="age"
                   min="1" max="120" required placeholder="e.g. 54">
          </div>

          <!-- Sex -->
          <div class="col-md-6">
            <label for="sex" class="form-label fw-semibold">Sex</label>
            <select class="form-select" id="sex" name="sex" required>
              <option value="" disabled selected>Select...</option>
              <option value="1">Male</option>
              <option value="0">Female</option>
            </select>
          </div>

          <!-- Chest Pain Type -->
          <div class="col-md-6">
            <label for="cp" class="form-label fw-semibold">Chest Pain Type
              <i class="bi bi-info-circle text-muted" data-bs-toggle="tooltip"
                 title="0=Typical Angina, 1=Atypical Angina, 2=Non-anginal, 3=Asymptomatic"></i>
            </label>
            <select class="form-select" id="cp" name="cp" required>
              <option value="" disabled selected>Select...</option>
              <option value="0">Typical Angina</option>
              <option value="1">Atypical Angina</option>
              <option value="2">Non-Anginal Pain</option>
              <option value="3">Asymptomatic</option>
            </select>
          </div>

          <!-- Resting Blood Pressure -->
          <div class="col-md-6">
            <label for="trestbps" class="form-label fw-semibold">Resting Blood Pressure (mmHg)
              <i class="bi bi-info-circle text-muted" data-bs-toggle="tooltip"
                 title="Resting blood pressure in mmHg on admission"></i>
            </label>
            <input type="number" class="form-control" id="trestbps" name="trestbps"
                   min="80" max="250" required placeholder="e.g. 130">
          </div>

          <!-- Cholesterol -->
          <div class="col-md-6">
            <label for="chol" class="form-label fw-semibold">Serum Cholesterol (mg/dl)
              <i class="bi bi-info-circle text-muted" data-bs-toggle="tooltip"
                 title="Serum cholesterol in mg/dl"></i>
            </label>
            <input type="number" class="form-control" id="chol" name="chol"
                   min="100" max="600" required placeholder="e.g. 250">
          </div>

          <!-- Fasting Blood Sugar -->
          <div class="col-md-6">
            <label for="fbs" class="form-label fw-semibold">Fasting Blood Sugar > 120 mg/dl
              <i class="bi bi-info-circle text-muted" data-bs-toggle="tooltip"
                 title="1 = True, 0 = False"></i>
            </label>
            <select class="form-select" id="fbs" name="fbs" required>
              <option value="" disabled selected>Select...</option>
              <option value="1">Yes (> 120 mg/dl)</option>
              <option value="0">No (&le; 120 mg/dl)</option>
            </select>
          </div>

          <!-- Resting ECG -->
          <div class="col-md-6">
            <label for="restecg" class="form-label fw-semibold">Resting ECG Results
              <i class="bi bi-info-circle text-muted" data-bs-toggle="tooltip"
                 title="0=Normal, 1=ST-T Abnormality, 2=Left Ventricular Hypertrophy"></i>
            </label>
            <select class="form-select" id="restecg" name="restecg" required>
              <option value="" disabled selected>Select...</option>
              <option value="0">Normal</option>
              <option value="1">ST-T Wave Abnormality</option>
              <option value="2">Left Ventricular Hypertrophy</option>
            </select>
          </div>

          <!-- Max Heart Rate -->
          <div class="col-md-6">
            <label for="thalach" class="form-label fw-semibold">Max Heart Rate Achieved
              <i class="bi bi-info-circle text-muted" data-bs-toggle="tooltip"
                 title="Maximum heart rate achieved during exercise"></i>
            </label>
            <input type="number" class="form-control" id="thalach" name="thalach"
                   min="60" max="220" required placeholder="e.g. 150">
          </div>

          <!-- Exercise Induced Angina -->
          <div class="col-md-6">
            <label for="exang" class="form-label fw-semibold">Exercise Induced Angina
              <i class="bi bi-info-circle text-muted" data-bs-toggle="tooltip"
                 title="Chest pain caused by exercise: 1=Yes, 0=No"></i>
            </label>
            <select class="form-select" id="exang" name="exang" required>
              <option value="" disabled selected>Select...</option>
              <option value="1">Yes</option>
              <option value="0">No</option>
            </select>
          </div>

          <!-- ST Depression (Oldpeak) -->
          <div class="col-md-6">
            <label for="oldpeak" class="form-label fw-semibold">ST Depression (Oldpeak)
              <i class="bi bi-info-circle text-muted" data-bs-toggle="tooltip"
                 title="ST depression induced by exercise relative to rest"></i>
            </label>
            <input type="number" class="form-control" id="oldpeak" name="oldpeak"
                   min="0" max="10" step="0.1" required placeholder="e.g. 1.5">
          </div>

          <!-- Slope -->
          <div class="col-md-6">
            <label for="slope" class="form-label fw-semibold">Slope of Peak Exercise ST
              <i class="bi bi-info-circle text-muted" data-bs-toggle="tooltip"
                 title="0=Upsloping, 1=Flat, 2=Downsloping"></i>
            </label>
            <select class="form-select" id="slope" name="slope" required>
              <option value="" disabled selected>Select...</option>
              <option value="0">Upsloping</option>
              <option value="1">Flat</option>
              <option value="2">Downsloping</option>
            </select>
          </div>

          <!-- Number of Major Vessels -->
          <div class="col-md-6">
            <label for="ca" class="form-label fw-semibold">Number of Major Vessels (0-3)
              <i class="bi bi-info-circle text-muted" data-bs-toggle="tooltip"
                 title="Number of major vessels colored by fluoroscopy (0-3)"></i>
            </label>
            <select class="form-select" id="ca" name="ca" required>
              <option value="" disabled selected>Select...</option>
              <option value="0">0</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
            </select>
          </div>

          <!-- Thal -->
          <div class="col-md-6">
            <label for="thal" class="form-label fw-semibold">Thalassemia (Thal)
              <i class="bi bi-info-circle text-muted" data-bs-toggle="tooltip"
                 title="1=Normal, 2=Fixed Defect, 3=Reversible Defect"></i>
            </label>
            <select class="form-select" id="thal" name="thal" required>
              <option value="" disabled selected>Select...</option>
              <option value="1">Normal</option>
              <option value="2">Fixed Defect</option>
              <option value="3">Reversible Defect</option>
            </select>
          </div>

        </div><!-- end row -->

        <!-- Submit Button -->
        <div class="text-center mt-4">
          <button type="submit" class="btn btn-danger btn-lg w-100">
            <i class="bi bi-heart-pulse"></i> Predict My Heart Risk
          </button>
        </div>

      </form>
    </div><!-- end card -->
  </div>
</section>

<!-- ============================================================ -->
<!-- Footer -->
<!-- ============================================================ -->
<footer class="bg-dark text-white text-center py-3 mt-4">
  <p class="mb-0">&copy; 2024 Heart Risk AI &mdash; For educational purposes only. Not a substitute for medical advice.</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
